<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Claims</title>
<style>
  :root{
    --blue:#2563eb;
    --blue-light:#eff6ff;
    --ink:#1f2937;
    --ink-muted:#6b7280;
    --border:#e2e8f0;
    --bg:#f4f5f7;
    --card:#ffffff;
    --danger:#dc2626;
    --danger-light:#fef2f2;
    --warn:#b45309;
    --warn-light:#fffbeb;
    --ok:#15803d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:88px;
  }
  a{color:var(--blue);}
  button{
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--ink);
    padding:9px 16px;
  }
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  button.primary:hover:not(:disabled){background:#1d4ed8;}
  button.danger{color:var(--danger);}
  button.danger:hover:not(:disabled){background:var(--danger-light);}
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
  }
  input[type=text], input[type=search], textarea{
    font-family:inherit;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    width:100%;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:64px;}
  input.field-changed, textarea.field-changed{
    border-color:var(--blue);
    background:var(--blue-light);
  }
  .topbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .topbar h1{font-size:17px;margin:0;}
  .topbar .brand{display:flex;align-items:center;gap:8px;}
  .topbar .brand a{color:var(--ink);text-decoration:none;font-weight:600;}
  #app{max-width:900px;margin:0 auto;padding:20px 16px 40px;}
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-muted);
  }
  .claims-list{display:flex;flex-direction:column;gap:10px;}
  .claim-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    color:inherit;
    gap:12px;
    flex-wrap:wrap;
  }
  .claim-row:hover{border-color:var(--blue);}
  .claim-row .title{font-weight:600;}
  .claim-row .meta{color:var(--ink-muted);font-size:13px;margin-top:2px;}
  .claim-row .amount{font-weight:600;font-variant-numeric:tabular-nums;}
  .status-pill{
    font-size:12px;
    padding:3px 10px;
    border-radius:999px;
    font-weight:600;
  }
  .status-pill.draft{background:#f1f5f9;color:#475569;}
  .status-pill.submitted{background:#dcfce7;color:var(--ok);}
  .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .page-header h1{font-size:20px;margin:0 0 4px;}
  .claim-title-input{font-size:20px;font-weight:700;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:8px;width:100%;}
  .claim-title-input:hover, .claim-title-input:focus{border-color:var(--border);background:#fff;}
  .back-link{display:inline-block;margin-bottom:14px;color:var(--ink-muted);text-decoration:none;font-size:14px;}
  .back-link:hover{color:var(--blue);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .dropzone{
    border:2px dashed var(--border);
    border-radius:var(--radius);
    padding:28px 16px;
    text-align:center;
    color:var(--ink-muted);
    margin-bottom:16px;
    cursor:pointer;
    background:var(--card);
  }
  .dropzone.dragover{border-color:var(--blue);background:var(--blue-light);color:var(--blue);}
  .doc-list{display:flex;flex-direction:column;gap:10px;}
  .doc-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    text-decoration:none;
    color:inherit;
    flex-wrap:wrap;
  }
  .doc-row:hover{border-color:var(--blue);}
  .doc-row .name{font-weight:600;word-break:break-word;}
  .chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .chip-processing{background:#f1f5f9;color:#475569;}
  .chip-review{background:var(--warn-light);color:var(--warn);}
  .chip-ready{background:#e0e7ff;color:#4338ca;}
  .chip-confirmed{background:#dcfce7;color:var(--ok);}
  .chip-failed{background:var(--danger-light);color:var(--danger);}
  textarea#note-field{margin-top:6px;}
  .claim-total-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:16px;}
  .claim-total-row .amount{font-weight:700;font-variant-numeric:tabular-nums;}
  .review-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  .review-layout > div{min-width:0;}
  @media (max-width: 800px){
    .review-layout{grid-template-columns:1fr;}
  }
  .doc-preview{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;min-height:320px;display:flex;flex-direction:column;}
  .doc-preview iframe, .doc-preview img{width:100%;flex:1;border:0;display:block;object-fit:contain;background:#525659;}
  .field-row{margin-bottom:14px;}
  .field-row label{display:block;font-size:13px;color:var(--ink-muted);margin-bottom:4px;font-weight:600;}
  .field-value{font-size:15px;padding:8px 10px;}
  .ai-was{font-size:12px;color:var(--ink-muted);margin-top:3px;}
  .ai-was .old-val{text-decoration:line-through;color:#9ca3af;}
  .ai-was .pen{color:var(--blue);}
  .warnings{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .warning-line{
    background:var(--warn-light);
    color:var(--warn);
    border:1px solid #fde68a;
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
  }
  details.collapsible{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
  details.collapsible summary{cursor:pointer;font-weight:600;font-size:14px;}
  table.items-table, table.trips-table{width:100%;min-width:560px;border-collapse:collapse;margin-top:10px;font-size:13px;}
  table.items-table th, table.items-table td, table.trips-table th, table.trips-table td{
    padding:6px 6px;text-align:left;border-bottom:1px solid var(--border);
  }
  table.trips-table td:first-child, table.trips-table th:first-child{min-width:110px;}
  .table-scroll{overflow-x:auto;}
  table.items-table input, table.trips-table input{font-size:13px;padding:5px 6px;width:100%;min-width:64px;}
  .action-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--card);
    border-top:1px solid var(--border);
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    z-index:50;
  }
  .action-bar .status-msg{font-size:13px;color:var(--ink-muted);margin-right:auto;}
  .action-bar .status-msg.error{color:var(--danger);}
  .action-bar .status-msg.saved{color:var(--ok);}
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.45);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  }
  .confirm-dialog{background:#fff;border-radius:var(--radius);padding:20px;max-width:360px;width:100%;}
  .confirm-dialog p{margin:0 0 16px;font-size:14px;}
  .confirm-dialog .dialog-actions{display:flex;justify-content:flex-end;gap:8px;}
  .inline-remove{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .read-only-note{background:#f1f5f9;color:#475569;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
  .corrections-summary{margin-top:8px;}
  .corrections-summary table{width:100%;border-collapse:collapse;font-size:13px;}
  .corrections-summary th, .corrections-summary td{padding:6px;border-bottom:1px solid var(--border);text-align:left;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="#/">Expense Claims</a></div>
  </div>
  <div id="app"></div>
  <div id="dialog-root"></div>

<script>
"use strict";

/* ---------------------------------------------------------------- API */

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const message = (data && data.detail) ? data.detail : `Request failed (${res.status})`;
    throw new Error(message);
  }
  return data;
}

async function uploadFile(claimId, file) {
  const form = new FormData();
  form.append("file", file);
  const res = await fetch(`/api/claims/${claimId}/documents`, { method: "POST", body: form });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const message = (data && data.detail) ? data.detail : `Upload failed (${res.status})`;
    throw new Error(message);
  }
  return data;
}

/* ------------------------------------------------------------- helpers */

function fmtMoney(value, currency) {
  if (value === null || value === undefined || value === "") return "–";
  const num = Number(value);
  if (Number.isNaN(num)) return String(value);
  if (!currency || currency === "INR") {
    return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", minimumFractionDigits: 2 }).format(num);
  }
  return `${num.toFixed(2)} ${currency}`;
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function debounce(fn, ms) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

function chipFor(doc) {
  if (doc.status === "processing") return { label: "Reading…", cls: "chip-processing" };
  if (doc.status === "failed") return { label: "Couldn't read – Retry", cls: "chip-failed" };
  if (doc.status === "needs_review") return { label: "Check this", cls: "chip-review" };
  if (doc.status === "confirmed") return { label: "Confirmed", cls: "chip-confirmed" };
  if (doc.review && doc.review.needs_confirm === false) return { label: "Confirmed", cls: "chip-confirmed" };
  return { label: "Ready to confirm", cls: "chip-ready" };
}

function docNeedsConfirmStill(doc) {
  if (doc.status === "confirmed") return false;
  if (doc.review && doc.review.needs_confirm === false) return false;
  return true;
}

/* Confirm dialog -- no browser alert()/confirm(), an inline overlay instead. */
function confirmDialog(message) {
  return new Promise((resolve) => {
    const root = document.getElementById("dialog-root");
    root.innerHTML = `
      <div class="overlay" role="presentation">
        <div class="confirm-dialog" role="alertdialog" aria-modal="true">
          <p>${escapeHtml(message)}</p>
          <div class="dialog-actions">
            <button type="button" id="dlg-cancel">Cancel</button>
            <button type="button" class="danger" id="dlg-ok">Discard</button>
          </div>
        </div>
      </div>`;
    const cleanup = (result) => { root.innerHTML = ""; resolve(result); };
    root.querySelector("#dlg-cancel").addEventListener("click", () => cleanup(false));
    root.querySelector("#dlg-ok").addEventListener("click", () => cleanup(true));
  });
}

/* ------------------------------------------------------------- router */

const routes = [];
function route(pattern, handler) { routes.push({ pattern, handler }); }

let activeGuard = null; // async () => boolean (true = allow navigation)

async function router() {
  const hash = location.hash || "#/";
  if (activeGuard) {
    const guard = activeGuard;
    activeGuard = null;
    const allowed = await guard();
    if (!allowed) {
      return; // guard rejected navigation -- URL already changed, but we just don't render the new route
    }
  }
  for (const r of routes) {
    const m = hash.match(r.pattern);
    if (m) { r.handler(...m.slice(1)); return; }
  }
  renderMyClaims();
}

window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

function navigate(path) {
  if (location.hash === path) { router(); return; }
  location.hash = path;
}

/* ---------------------------------------------------------- My claims */

route(/^#\/$/, renderMyClaims);

async function renderMyClaims() {
  const app = document.getElementById("app");
  app.innerHTML = `<div class="page-header"><h1>My claims</h1><button class="primary" id="new-claim">New claim</button></div><div id="claims-body">Loading…</div>`;
  document.getElementById("new-claim").addEventListener("click", async (e) => {
    e.target.disabled = true;
    try {
      const claim = await api("POST", "/api/claims", {});
      navigate(`#/claims/${claim.id}`);
    } catch (err) {
      e.target.disabled = false;
      alertInline("claims-body", err.message);
    }
  });

  let claims;
  try {
    claims = await api("GET", "/api/claims");
  } catch (err) {
    document.getElementById("claims-body").innerHTML = `<div class="warning-line">${escapeHtml(err.message)}</div>`;
    return;
  }

  const body = document.getElementById("claims-body");
  if (claims.length === 0) {
    body.innerHTML = `<div class="empty-state">No claims yet. Click "New claim" to add your first receipt or bill.</div>`;
    return;
  }
  body.innerHTML = `<div class="claims-list">${claims.map(claimRowHtml).join("")}</div>`;
}

function claimRowHtml(c) {
  const pillClass = c.status === "submitted" ? "submitted" : "draft";
  const pillLabel = c.status === "submitted" ? "Submitted" : "Draft";
  return `
    <a class="claim-row" href="#/claims/${c.id}">
      <div>
        <div class="title">${escapeHtml(c.title)}</div>
        <div class="meta">${c.document_count} document${c.document_count === 1 ? "" : "s"} &middot; updated ${fmtDate(c.updated_at)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="amount">${fmtMoney(c.total_amount, c.currency)}</span>
        <span class="status-pill ${pillClass}">${pillLabel}</span>
      </div>
    </a>`;
}

function alertInline(containerId, message) {
  const el = document.getElementById(containerId);
  const div = document.createElement("div");
  div.className = "warning-line";
  div.style.marginBottom = "12px";
  div.textContent = message;
  el.prepend(div);
}

/* ------------------------------------------------------------ Claim page */

route(/^#\/claims\/([^/]+)$/, renderClaimPage);

let claimPollTimer = null;

function stopClaimPolling() {
  if (claimPollTimer) { clearInterval(claimPollTimer); claimPollTimer = null; }
}

async function renderClaimPage(claimId) {
  stopClaimPolling();
  const app = document.getElementById("app");
  app.innerHTML = `<a class="back-link" href="#/">&larr; My claims</a><div id="claim-body">Loading…</div>`;

  let claim;
  try {
    claim = await api("GET", `/api/claims/${claimId}`);
  } catch (err) {
    document.getElementById("claim-body").innerHTML = `<div class="warning-line">${escapeHtml(err.message)}</div>`;
    return;
  }

  drawClaimPage(claim);

  const anyProcessing = claim.documents.some((d) => d.status === "processing");
  if (anyProcessing) {
    claimPollTimer = setInterval(async () => {
      let fresh;
      try {
        fresh = await api("GET", `/api/claims/${claimId}`);
      } catch (err) {
        return;
      }
      drawClaimPage(fresh);
      if (!fresh.documents.some((d) => d.status === "processing")) stopClaimPolling();
    }, 2000);
  }
}

function drawClaimPage(claim) {
  const body = document.getElementById("claim-body");
  const isDraft = claim.status === "draft";

  const pending = claim.documents.filter(docNeedsConfirmStill).map((d) => d.original_name);
  let submitDisabled = false;
  let submitReason = "";
  if (claim.documents.length === 0) {
    submitDisabled = true;
    submitReason = "Add at least one document to submit.";
  } else if (pending.length > 0) {
    submitDisabled = true;
    submitReason = `Confirm every document before submitting: ${pending.join(", ")}`;
  }

  const submittedBanner = !isDraft ? `
    <div class="card" style="border-color:var(--ok);">
      <strong>Submitted on ${fmtDate(claim.submitted_at)}</strong>
      <div style="margin-top:4px;">Total: <strong>${fmtMoney(claim.total_amount, claim.currency)}</strong></div>
      ${correctionsSummaryHtml(claim)}
    </div>` : "";

  body.innerHTML = `
    ${isDraft
      ? `<input class="claim-title-input" id="claim-title" value="${escapeHtml(claim.title)}" aria-label="Claim title">`
      : `<h1>${escapeHtml(claim.title)}</h1>`}
    ${submittedBanner}
    ${isDraft ? `<div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Add documents">
        Drag receipts or bills here, or click to choose files
        <input type="file" id="file-input" multiple accept="application/pdf,image/png,image/jpeg,image/webp" style="display:none;">
      </div>` : ""}
    <div id="upload-errors"></div>
    <div class="doc-list">
      ${claim.documents.length === 0 ? `<div class="empty-state">No documents yet.</div>` : claim.documents.map(docRowHtml).join("")}
    </div>
    <div class="card" style="margin-top:16px;">
      <label for="note-field" style="font-weight:600;font-size:13px;color:var(--ink-muted);">Note to approver</label>
      <textarea id="note-field" ${isDraft ? "" : "readonly"} placeholder="Explain anything unusual about this claim (optional)">${escapeHtml(claim.note_to_approver || "")}</textarea>
    </div>
    <div class="claim-total-row">
      <span>Total</span>
      <span class="amount">${fmtMoney(claim.total_amount, claim.currency)}</span>
    </div>
  `;

  renderClaimActionBar(claim, submitDisabled, submitReason);

  if (isDraft) {
    document.getElementById("claim-title").addEventListener("change", async (e) => {
      try {
        await api("PATCH", `/api/claims/${claim.id}`, { title: e.target.value });
        setActionBarStatus("Saved", false);
      } catch (err) {
        setActionBarStatus(err.message, true);
      }
    });

    const saveNote = debounce(async (value) => {
      try {
        await api("PATCH", `/api/claims/${claim.id}`, { note_to_approver: value });
        setActionBarStatus("Saved", false);
      } catch (err) {
        setActionBarStatus(err.message, true);
      }
    }, 400);
    document.getElementById("note-field").addEventListener("input", (e) => saveNote(e.target.value));

    wireDropzone(claim.id);
  }
}

function correctionsSummaryHtml(claim) {
  const rows = [];
  for (const doc of claim.documents) {
    for (const c of doc.corrections || []) {
      rows.push({ doc: doc.original_name, field: c.field_path, ai: c.ai_value, you: c.employee_value });
    }
  }
  if (rows.length === 0) return "";
  return `
    <div class="corrections-summary">
      <div style="font-weight:600;margin-top:10px;margin-bottom:4px;">Values you corrected</div>
      <table>
        <thead><tr><th>Document</th><th>Field</th><th>AI read</th><th>You entered</th></tr></thead>
        <tbody>
          ${rows.map((r) => `<tr><td>${escapeHtml(r.doc)}</td><td>${escapeHtml(r.field)}</td><td>${escapeHtml(r.ai)}</td><td>${escapeHtml(r.you)}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function docRowHtml(d) {
  const chip = chipFor(d);
  return `
    <a class="doc-row" href="#/documents/${d.id}">
      <span class="name">${escapeHtml(d.original_name)}</span>
      <span class="chip ${chip.cls}">${chip.label}</span>
    </a>`;
}

function renderClaimActionBar(claim, submitDisabled, submitReason) {
  let bar = document.querySelector(".action-bar");
  if (bar) bar.remove();
  if (claim.status !== "draft") return;
  bar = document.createElement("div");
  bar.className = "action-bar";
  bar.innerHTML = `
    <span class="status-msg" id="claim-status-msg" title="${escapeHtml(submitReason)}">${submitDisabled ? escapeHtml(submitReason) : ""}</span>
    <button class="primary" id="submit-claim" ${submitDisabled ? "disabled" : ""}>Submit claim</button>
  `;
  document.body.appendChild(bar);
  document.getElementById("submit-claim").addEventListener("click", async (e) => {
    e.target.disabled = true;
    try {
      const submitted = await api("POST", `/api/claims/${claim.id}/submit`);
      drawClaimPage(submitted);
    } catch (err) {
      setActionBarStatus(err.message, true);
      e.target.disabled = false;
    }
  });
}

function setActionBarStatus(message, isError) {
  const el = document.getElementById("claim-status-msg");
  if (!el) return;
  el.textContent = message;
  el.className = "status-msg" + (isError ? " error" : " saved");
  if (!isError) setTimeout(() => { if (el.textContent === message) el.textContent = ""; }, 2500);
}

function wireDropzone(claimId) {
  const zone = document.getElementById("dropzone");
  const input = document.getElementById("file-input");
  zone.addEventListener("click", () => input.click());
  zone.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", () => { handleFiles(claimId, Array.from(input.files)); input.value = ""; });

  ["dragenter", "dragover"].forEach((evt) => zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach((evt) => zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove("dragover"); }));
  zone.addEventListener("drop", (e) => {
    const files = Array.from(e.dataTransfer.files || []);
    if (files.length) handleFiles(claimId, files);
  });
}

async function handleFiles(claimId, files) {
  const errBox = document.getElementById("upload-errors");
  errBox.innerHTML = "";
  for (const file of files) {
    try {
      await uploadFile(claimId, file);
    } catch (err) {
      const div = document.createElement("div");
      div.className = "warning-line";
      div.style.marginBottom = "8px";
      div.textContent = `${file.name}: ${err.message}`;
      errBox.appendChild(div);
    }
  }
  renderClaimPage(claimId);
}

/* ------------------------------------------------------- Document review */

route(/^#\/documents\/([^/]+)$/, renderDocumentPage);

let docPageState = null; // { doc, edits: {path: value}, dirty: bool, saving: bool }

async function renderDocumentPage(documentId) {
  const app = document.getElementById("app");
  app.innerHTML = `<div id="doc-body">Loading…</div>`;

  let doc;
  try {
    doc = await api("GET", `/api/documents/${documentId}`);
  } catch (err) {
    document.getElementById("doc-body").innerHTML = `<div class="warning-line">${escapeHtml(err.message)}</div>`;
    return;
  }

  docPageState = { doc, edits: {}, dirty: false, saving: false };

  activeGuard = async () => {
    if (!docPageState || !docPageState.dirty) return true;
    return await confirmDialog("Discard unsaved changes?");
  };

  drawDocumentPage();
}

function backToClaim() {
  navigate(`#/claims/${docPageState.doc.claim_id || claimIdFromReferrer()}`);
}

function claimIdFromReferrer() {
  // claim_id isn't in the document payload; recovered from the claim
  // page's own link structure isn't available here, so the API returns
  // it explicitly -- see _document_detail's claim_id field.
  return docPageState.doc.claim_id;
}

function drawDocumentPage() {
  const { doc } = docPageState;
  const body = document.getElementById("doc-body");
  const claimHash = `#/claims/${doc.claim_id}`;

  if (doc.status === "processing") {
    body.innerHTML = `<a class="back-link" href="${claimHash}">&larr; Back to claim</a><div class="empty-state">Still reading this document…</div>`;
    setTimeout(async () => {
      if (!docPageState || docPageState.doc.id !== doc.id) return;
      const fresh = await api("GET", `/api/documents/${doc.id}`).catch(() => null);
      if (fresh && docPageState && docPageState.doc.id === doc.id) {
        docPageState.doc = fresh;
        drawDocumentPage();
      }
    }, 2000);
    return;
  }

  if (doc.status === "failed") {
    body.innerHTML = `
      <a class="back-link" href="${claimHash}">&larr; Back to claim</a>
      <div class="warning-line">Couldn't read this document${doc.error_message ? ": " + escapeHtml(doc.error_message) : "."}</div>
      <button class="primary" id="retry-btn">Retry</button>
      <button id="remove-btn" style="margin-left:8px;">Remove document</button>
      <div id="inline-remove"></div>`;
    document.getElementById("retry-btn").addEventListener("click", async (e) => {
      e.target.disabled = true;
      try {
        await api("POST", `/api/documents/${doc.id}/retry`);
        navigate(claimHash);
      } catch (err) {
        e.target.disabled = false;
        alertInline("doc-body", err.message);
      }
    });
    wireRemoveButton(doc);
    return;
  }

  const review = doc.review;
  const readOnly = !review.needs_confirm;

  body.innerHTML = `
    <a class="back-link" href="${claimHash}">&larr; Back to claim</a>
    <h1 style="font-size:18px;">${escapeHtml(doc.original_name)}</h1>
    ${readOnly ? `<div class="read-only-note">This is a supporting document. Nothing to confirm here.</div>` : ""}
    <div class="review-layout">
      <div class="doc-preview">${previewHtml(doc)}</div>
      <div>
        ${review.warnings.map((w) => `<div class="warning-line">${escapeHtml(w)}</div>`).join("")}
        <div id="fields-container"></div>
      </div>
    </div>
  `;

  renderFields(review);
  renderDocActionBar();
}

function previewHtml(doc) {
  const url = `/api/documents/${doc.id}/file`;
  if (doc.mime_type === "application/pdf") {
    return `<iframe src="${url}" title="Document preview"></iframe>`;
  }
  return `<img src="${url}" alt="Document preview">`;
}

function currentFieldValue(field) {
  return Object.prototype.hasOwnProperty.call(docPageState.edits, field.key) ? docPageState.edits[field.key] : field.value;
}

/* A field counts as "changed" either because of an unsaved local edit
   this session, or because a correction was already saved to the server
   on a previous save -- the AI-value-struck-through marker must survive
   a reload, so it can't rely on docPageState.edits alone (session-only). */
function fieldChangeInfo(key, currentSavedValue) {
  const localEdit = Object.prototype.hasOwnProperty.call(docPageState.edits, key);
  const correction = (docPageState.doc.corrections || []).find((c) => c.field_path === key);
  if (localEdit) return { changed: true, aiValue: currentSavedValue };
  if (correction) return { changed: true, aiValue: correction.ai_value };
  return { changed: false, aiValue: null };
}

function markDirty() {
  docPageState.dirty = Object.keys(docPageState.edits).length > 0;
  updateActionBarState();
}

function renderFields(review) {
  const container = document.getElementById("fields-container");
  let html = "";
  for (const field of review.fields) {
    if (field.key === "travel_entries") {
      html += tripsTableHtml(field);
    } else {
      html += simpleFieldHtml(field);
    }
  }
  if (review.collapsible) {
    html += collapsibleHtml(review.collapsible);
  }
  container.innerHTML = html;
  wireFieldInputs();
}

function simpleFieldHtml(field) {
  const value = currentFieldValue(field);
  const { changed, aiValue } = fieldChangeInfo(field.key, field.value);
  const displayAsMoney = /amount|total|subtotal|tax|cgst|sgst|grand_total/i.test(field.key) && typeof field.value !== "object";
  if (!field.editable) {
    const shown = field.key === "amount" || displayAsMoney ? fmtMoney(value, "INR") : escapeHtml(value ?? "–");
    return `<div class="field-row"><label>${escapeHtml(field.label)}</label><div class="field-value">${shown}</div></div>`;
  }
  return `
    <div class="field-row">
      <label for="f-${field.key}">${escapeHtml(field.label)}</label>
      <input type="text" id="f-${field.key}" data-path="${field.key}" class="${changed ? "field-changed" : ""}"
             value="${escapeHtml(value ?? "")}" inputmode="${displayAsMoney ? "decimal" : "text"}">
      ${changed ? `<div class="ai-was"><span class="pen">✎</span> AI read <span class="old-val">${escapeHtml(aiValue ?? "–")}</span></div>` : ""}
    </div>`;
}

function tripsTableHtml(field) {
  const trips = currentFieldValue(field) || [];
  const { changed } = fieldChangeInfo(field.key, field.value);
  const cols = [["date", "Date"], ["place", "Place"], ["purpose", "Purpose"], ["client", "Client"], ["kms", "Km"]];
  const rows = trips.map((trip, i) => `
    <tr>
      ${cols.map(([key, _label]) => `<td><input type="text" data-trip-index="${i}" data-trip-key="${key}" value="${escapeHtml(trip[key] ?? "")}"></td>`).join("")}
    </tr>`).join("");
  return `
    <div class="field-row">
      <label>Trips</label>
      <div class="table-scroll">
        <table class="trips-table" id="trips-table">
          <thead><tr>${cols.map(([, label]) => `<th>${label}</th>`).join("")}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${changed ? `<div class="ai-was"><span class="pen">✎</span> Trips edited</div>` : ""}
    </div>`;
}

function collapsibleHtml(collapsible) {
  const items = currentFieldValue({ key: "line_items", value: collapsible.line_items }) || collapsible.line_items || [];
  const { changed: itemsChanged } = fieldChangeInfo("line_items", collapsible.line_items);
  const cols = [["name", "Item"], ["quantity", "Qty"], ["unit_price", "Unit price"], ["total", "Total"]];
  const rows = items.map((item, i) => `
    <tr>
      ${cols.map(([key]) => `<td><input type="text" data-item-index="${i}" data-item-key="${key}" value="${escapeHtml(item[key] ?? "")}"></td>`).join("")}
    </tr>`).join("");
  const extra = (collapsible.extra_fields || []).map((f) => simpleFieldHtml(f)).join("");
  return `
    <details class="collapsible" ${collapsible.auto_expand ? "open" : ""}>
      <summary>${escapeHtml(collapsible.label)}</summary>
      ${extra}
      <div class="table-scroll">
        <table class="items-table" id="items-table">
          <thead><tr>${cols.map(([, label]) => `<th>${label}</th>`).join("")}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${itemsChanged ? `<div class="ai-was"><span class="pen">✎</span> Items edited</div>` : ""}
    </details>`;
}

const debouncedValidate = debounce(runValidate, 400);

function wireFieldInputs() {
  document.querySelectorAll("#fields-container input[data-path]").forEach((input) => {
    input.addEventListener("input", (e) => {
      docPageState.edits[e.target.dataset.path] = e.target.value;
      markDirty();
      debouncedValidate();
    });
  });
  document.querySelectorAll("#trips-table input[data-trip-index]").forEach((input) => {
    input.addEventListener("input", (e) => {
      applyTableEdit("travel_entries", Number(e.target.dataset.tripIndex), e.target.dataset.tripKey, e.target.value);
      markDirty();
      debouncedValidate();
    });
  });
  document.querySelectorAll("#items-table input[data-item-index]").forEach((input) => {
    input.addEventListener("input", (e) => {
      applyTableEdit("line_items", Number(e.target.dataset.itemIndex), e.target.dataset.itemKey, e.target.value);
      markDirty();
      debouncedValidate();
    });
  });
}

function applyTableEdit(rootKey, index, key, value) {
  const field = docPageState.doc.review.fields.find((f) => f.key === rootKey)
    || { key: rootKey, value: (docPageState.doc.review.collapsible && docPageState.doc.review.collapsible.line_items) || [] };
  const base = docPageState.edits[rootKey] ? docPageState.edits[rootKey] : JSON.parse(JSON.stringify(field.value || []));
  if (!base[index]) base[index] = {};
  base[index][key] = value;
  docPageState.edits[rootKey] = base;
}

async function runValidate() {
  if (!docPageState || Object.keys(docPageState.edits).length === 0) return;
  try {
    const result = await api("POST", `/api/documents/${docPageState.doc.id}/validate`, { edits: docPageState.edits });
    docPageState.doc.review = { ...docPageState.doc.review, warnings: result.review.warnings, needs_review: result.review.needs_review };
    const warningsHtml = result.review.warnings.map((w) => `<div class="warning-line">${escapeHtml(w)}</div>`).join("");
    const layout = document.querySelector(".review-layout > div:last-child");
    if (layout) {
      const existingWarnings = layout.querySelectorAll(".warning-line");
      existingWarnings.forEach((w) => w.remove());
      document.getElementById("fields-container").insertAdjacentHTML("beforebegin", warningsHtml);
    }
  } catch (err) {
    setDocActionBarStatus(err.message, true);
  }
}

function renderDocActionBar() {
  let bar = document.querySelector(".action-bar");
  if (bar) bar.remove();
  const { doc } = docPageState;
  const review = doc.review;
  bar = document.createElement("div");
  bar.className = "action-bar";
  const dirtyLabel = docPageState.dirty ? "Unsaved changes" : "";
  bar.innerHTML = `
    <span class="status-msg" id="doc-status-msg">${dirtyLabel}</span>
    <button id="btn-back">Back to claim</button>
    ${review.needs_confirm ? `<button id="btn-undo">Undo my changes</button>` : ""}
    ${review.needs_confirm ? `<button id="btn-save">Save changes</button>` : ""}
    ${review.needs_confirm ? `<button class="primary" id="btn-confirm">${doc.status === "confirmed" ? "Confirmed" : "Confirm"}</button>` : ""}
    <button class="danger" id="btn-remove">Remove document</button>
  `;
  document.body.appendChild(bar);

  document.getElementById("btn-back").addEventListener("click", async () => {
    if (docPageState.dirty && !(await confirmDialog("Discard unsaved changes?"))) return;
    navigate(`#/claims/${doc.claim_id}`);
  });

  const saveBtn = document.getElementById("btn-save");
  if (saveBtn) saveBtn.addEventListener("click", saveDocumentEdits);

  const undoBtn = document.getElementById("btn-undo");
  if (undoBtn) undoBtn.addEventListener("click", undoDocumentChanges);

  const confirmBtn = document.getElementById("btn-confirm");
  if (confirmBtn && doc.status !== "confirmed") confirmBtn.addEventListener("click", confirmDocument);

  wireRemoveButton(doc);
  updateActionBarState();
}

function updateActionBarState() {
  const msg = document.getElementById("doc-status-msg");
  if (msg && !msg.classList.contains("error") && !msg.classList.contains("saved")) {
    msg.textContent = docPageState.dirty ? "Unsaved changes" : "";
  }
}

function setDocActionBarStatus(message, isError) {
  const el = document.getElementById("doc-status-msg");
  if (!el) return;
  el.textContent = message;
  el.className = "status-msg" + (isError ? " error" : " saved");
  if (!isError) setTimeout(() => { if (el.textContent === message) updateActionBarState(); }, 2500);
}

function setButtonsBusy(busy) {
  document.querySelectorAll(".action-bar button").forEach((b) => { b.disabled = busy; });
}

async function saveDocumentEdits() {
  if (docPageState.saving || Object.keys(docPageState.edits).length === 0) return;
  docPageState.saving = true;
  setButtonsBusy(true);
  try {
    const updated = await api("PUT", `/api/documents/${docPageState.doc.id}/fields`, { edits: docPageState.edits });
    docPageState.doc = updated;
    docPageState.edits = {};
    docPageState.dirty = false;
    drawDocumentPage();
    setDocActionBarStatus("Saved", false);
  } catch (err) {
    setDocActionBarStatus(err.message, true);
  } finally {
    docPageState.saving = false;
    setButtonsBusy(false);
  }
}

async function undoDocumentChanges() {
  setButtonsBusy(true);
  try {
    const updated = await api("POST", `/api/documents/${docPageState.doc.id}/revert`);
    docPageState.doc = updated;
    docPageState.edits = {};
    docPageState.dirty = false;
    drawDocumentPage();
    setDocActionBarStatus("Reverted to the AI values", false);
  } catch (err) {
    setDocActionBarStatus(err.message, true);
    setButtonsBusy(false);
  }
}

async function confirmDocument() {
  setButtonsBusy(true);
  try {
    const updated = await api("POST", `/api/documents/${docPageState.doc.id}/confirm`, { edits: docPageState.edits });
    docPageState.doc = updated;
    docPageState.edits = {};
    docPageState.dirty = false;
    navigate(`#/claims/${updated.claim_id}`);
  } catch (err) {
    setDocActionBarStatus(err.message, true);
    setButtonsBusy(false);
  }
}

function wireRemoveButton(doc) {
  const btn = document.getElementById("btn-remove") || document.getElementById("remove-btn");
  if (!btn) return;
  btn.addEventListener("click", async () => {
    const box = document.getElementById("inline-remove") || createInlineRemoveBox();
    box.innerHTML = `
      <div class="inline-remove">
        <span>Remove this document?</span>
        <button type="button" class="danger" id="confirm-remove">Remove</button>
        <button type="button" id="cancel-remove">Cancel</button>
      </div>`;
    document.getElementById("cancel-remove").addEventListener("click", () => { box.innerHTML = ""; });
    document.getElementById("confirm-remove").addEventListener("click", async () => {
      try {
        await api("DELETE", `/api/documents/${doc.id}`);
        navigate(`#/claims/${doc.claim_id}`);
      } catch (err) {
        setDocActionBarStatus(err.message, true);
      }
    });
  });
}

function createInlineRemoveBox() {
  const div = document.createElement("div");
  div.id = "inline-remove";
  document.getElementById("doc-body").appendChild(div);
  return div;
}
</script>
</body>
</html>
