<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Claims</title>
<style>
  :root{
    --blue:#2563eb;
    --blue-light:#eff6ff;
    --ink:#1f2937;
    --ink-muted:#6b7280;
    --border:#e2e8f0;
    --bg:#f4f5f7;
    --card:#ffffff;
    --danger:#dc2626;
    --danger-light:#fef2f2;
    --warn:#b45309;
    --warn-light:#fffbeb;
    --ok:#15803d;
    --radius:10px;
    --action-bar-height:88px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:var(--action-bar-height);
  }
  a{color:var(--blue);}
  button{
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--ink);
    padding:9px 16px;
  }
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  button.primary:hover:not(:disabled){background:#1d4ed8;}
  button.danger{color:var(--danger);}
  button.danger:hover:not(:disabled){background:var(--danger-light);}
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
  }
  input[type=text], input[type=search], textarea, select{
    font-family:inherit;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    width:100%;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:64px;}
  input.field-changed, textarea.field-changed, select.field-changed{
    border-color:var(--blue);
    background:var(--blue-light);
  }
  .topbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .topbar h1{font-size:17px;margin:0;}
  .topbar .brand{display:flex;align-items:center;gap:8px;}
  .topbar .brand a{color:var(--ink);text-decoration:none;font-weight:600;}
  #app{max-width:900px;margin:0 auto;padding:20px 16px 40px;}
  /* The document review page opts into this (item 4: use the full
     width) -- every other page keeps the narrower 900px reading width. */
  #app.wide{max-width:1600px;}
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-muted);
  }
  .claims-list{display:flex;flex-direction:column;gap:10px;}
  .claim-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    color:inherit;
    gap:12px;
    flex-wrap:wrap;
  }
  .claim-row:hover{border-color:var(--blue);}
  .claim-row .title{font-weight:600;}
  .claim-row .meta{color:var(--ink-muted);font-size:13px;margin-top:2px;}
  .claim-row .amount{font-weight:600;font-variant-numeric:tabular-nums;}
  .status-pill{
    font-size:12px;
    padding:3px 10px;
    border-radius:999px;
    font-weight:600;
  }
  .status-pill.draft{background:#f1f5f9;color:#475569;}
  .status-pill.submitted{background:#dcfce7;color:var(--ok);}
  .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .page-header h1{font-size:20px;margin:0 0 4px;}
  .claim-title-input{font-size:20px;font-weight:700;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:8px;width:100%;}
  .claim-title-input:hover, .claim-title-input:focus{border-color:var(--border);background:#fff;}
  .back-link{display:inline-block;margin-bottom:14px;color:var(--ink-muted);text-decoration:none;font-size:14px;}
  .back-link:hover{color:var(--blue);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .dropzone{
    border:2px dashed var(--border);
    border-radius:var(--radius);
    padding:28px 16px;
    text-align:center;
    color:var(--ink-muted);
    margin-bottom:16px;
    cursor:pointer;
    background:var(--card);
  }
  .dropzone.dragover{border-color:var(--blue);background:var(--blue-light);color:var(--blue);}
  .doc-list{display:flex;flex-direction:column;gap:10px;}
  .doc-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    text-decoration:none;
    color:inherit;
    flex-wrap:wrap;
  }
  .doc-row:hover{border-color:var(--blue);}
  .doc-row .name{font-weight:600;word-break:break-word;}
  .chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .chip-processing{background:#f1f5f9;color:#475569;}
  .chip-review{background:var(--warn-light);color:var(--warn);}
  .chip-ready{background:#e0e7ff;color:#4338ca;}
  .chip-confirmed{background:#dcfce7;color:var(--ok);}
  .chip-failed{background:var(--danger-light);color:var(--danger);}
  textarea#note-field{margin-top:6px;}
  .claim-total-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:16px;}
  .claim-total-row .amount{font-weight:700;font-variant-numeric:tabular-nums;}
  /* Document ~55%, form the rest, per item 4 -- doc-preview is sticky
     and fills the viewport height minus the fixed action bar, so it
     stays visible while the (often much taller) form column scrolls. */
  .review-layout{display:grid;grid-template-columns:55% 1fr;gap:20px;align-items:start;}
  .review-layout > div{min-width:0;}
  @media (max-width: 900px){
    .review-layout{grid-template-columns:1fr;}
    .review-layout .doc-preview{position:static;height:auto;max-height:480px;}
  }
  .doc-preview{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;min-height:320px;display:flex;flex-direction:column;
    position:sticky;top:16px;height:calc(100vh - 32px - var(--action-bar-height));
  }
  .doc-preview iframe{width:100%;flex:1;border:0;display:block;background:#525659;}
  /* Item 1 (quick-fix pass): an image preview used to be capped to the
     panel's fixed height with overflow:hidden, silently cropping the
     bottom of a tall receipt. Now it scrolls (overflow:auto) inside the
     sticky panel, full panel width by default ("actual size" relative
     to the panel), with a toggle to shrink the whole image into view
     instead. PDFs are unaffected -- the iframe above keeps the
     browser's own viewer. */
  .preview-toolbar{
    display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);
    flex:0 0 auto;background:var(--card);
  }
  .preview-toolbar button{padding:5px 10px;font-size:12px;}
  .preview-toolbar button.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .preview-scroll{flex:1;overflow:auto;background:#525659;}
  .preview-scroll img{display:block;width:100%;height:auto;}
  .preview-scroll.fit-mode{display:flex;align-items:center;justify-content:center;}
  .preview-scroll.fit-mode img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;}
  .field-row{margin-bottom:14px;}
  .field-row label{display:block;font-size:13px;color:var(--ink-muted);margin-bottom:4px;font-weight:600;}
  .field-value{font-size:15px;padding:8px 10px;}
  /* A check about the trips failing highlights the Km column header
     (table.trips-table th.field-highlight, above) and this field --
     the one place on the form the resulting bad total actually shows. */
  .field-row.field-highlight{background:var(--warn-light);border-radius:8px;padding:8px 10px;margin-left:-10px;margin-right:-10px;}
  .field-row.field-highlight label{color:var(--warn);}
  .ai-was{font-size:12px;color:var(--ink-muted);margin-top:3px;}
  .ai-was .old-val{text-decoration:line-through;color:#9ca3af;}
  .ai-was .pen{color:var(--blue);}
  .warnings{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .warning-line{
    background:var(--warn-light);
    color:var(--warn);
    border:1px solid #fde68a;
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
  }
  details.collapsible{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
  details.collapsible summary{cursor:pointer;font-weight:600;font-size:14px;}
  table.items-table, table.trips-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
  /* items-table (Item/Qty/Unit price/Amount) must fit without a
     horizontal scrollbar at desktop width; only 390px needs it to
     scroll (table-scroll's overflow-x:auto still applies there). */
  table.items-table{min-width:380px;}
  /* trips-table (Date/Place/Purpose/Client/Km) uses table-layout:fixed
     with explicit column widths summing to 100% -- item 4: must show
     every column, including Km, with no horizontal scrollbar at
     >=1280px wide, so it deliberately does NOT get a min-width past
     its container the way items-table's free-form layout does; long
     text wraps instead of forcing overflow. */
  table.trips-table{table-layout:fixed;}
  table.trips-table col.col-date{width:16%;}
  table.trips-table col.col-place{width:24%;}
  table.trips-table col.col-purpose{width:24%;}
  table.trips-table col.col-client{width:20%;}
  table.trips-table col.col-kms{width:16%;}
  table.items-table th, table.items-table td, table.trips-table th, table.trips-table td{
    padding:6px 6px;text-align:left;border-bottom:1px solid var(--border);
  }
  table.trips-table th, table.trips-table td{word-wrap:break-word;overflow-wrap:break-word;}
  table.trips-table th.col-num, table.trips-table td.col-num{text-align:right;}
  table.trips-table th.field-highlight{background:var(--warn-light);color:var(--warn);}
  .table-scroll{overflow-x:auto;}
  table.items-table input{font-size:13px;padding:5px 6px;width:100%;min-width:64px;}
  /* Click/focus-to-edit trips cell: plain text until activated (never
     a bordered input sitting there unedited), replaced with a real
     <input> on click, focus, or Enter -- and back to text on blur or
     Enter/Escape inside it. Tab reaches every cell in DOM order since
     .cell-text is a normal tabbable element. */
  table.trips-table td.cell-editable{padding:0;}
  table.trips-table .cell-text{
    display:block;padding:6px 6px;cursor:text;min-height:1.2em;
    border:1px solid transparent;border-radius:4px;
  }
  table.trips-table .cell-text:hover{background:var(--bg);}
  table.trips-table .cell-text:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;}
  table.trips-table td.cell-editable input{
    font-size:13px;padding:5px 6px;width:100%;border:1px solid var(--blue);border-radius:4px;
  }
  table.trips-table td.col-num .cell-text, table.trips-table td.col-num input{text-align:right;}
  .empty-items{padding:14px 0;color:var(--ink-muted);font-size:14px;}
  .empty-items button{margin-top:8px;}
  .action-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--card);
    border-top:1px solid var(--border);
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    z-index:50;
  }
  .action-bar .status-msg{font-size:13px;color:var(--ink-muted);margin-right:auto;}
  .action-bar .status-msg.error{color:var(--danger);}
  .action-bar .status-msg.saved{color:var(--ok);}
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.45);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  }
  .confirm-dialog{background:#fff;border-radius:var(--radius);padding:20px;max-width:360px;width:100%;}
  .confirm-dialog p{margin:0 0 16px;font-size:14px;}
  .confirm-dialog .dialog-actions{display:flex;justify-content:flex-end;gap:8px;}
  .inline-remove{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .read-only-note{background:#f1f5f9;color:#475569;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
  .corrections-summary{margin-top:8px;}
  .corrections-summary table{width:100%;border-collapse:collapse;font-size:13px;}
  .corrections-summary th, .corrections-summary td{padding:6px;border-bottom:1px solid var(--border);text-align:left;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="#/">Expense Claims</a></div>
  </div>
  <div id="app"></div>
  <div id="dialog-root"></div>

<script>
"use strict";

/* ---------------------------------------------------------------- API */

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const message = (data && data.detail) ? data.detail : `Request failed (${res.status})`;
    throw new Error(message);
  }
  return data;
}

async function uploadFile(claimId, file) {
  const form = new FormData();
  form.append("file", file);
  const res = await fetch(`/api/claims/${claimId}/documents`, { method: "POST", body: form });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const message = (data && data.detail) ? data.detail : `Upload failed (${res.status})`;
    throw new Error(message);
  }
  return data;
}

/* ------------------------------------------------------------- helpers */

// Explicit allowlist, not a substring match on the field key -- "total_kms"
// contains "total" too, and a distance is not an amount. Extended with
// unit_price for the corrections table below, since a line-item edit's
// field_path leaf is "unit_price"/"total" (e.g. "line_items[2].total"),
// not a bare top-level key.
const MONEY_FIELD_KEYS = new Set([
  "amount", "total", "subtotal", "tax", "cgst", "sgst", "grand_total",
  "total_conveyance_amount", "daily_allowance_amount", "vehicle_maintenance_amount",
  "mobile_allowance_amount", "total_claimed", "unit_price",
]);

function isMoneyFieldPath(fieldPath) {
  const parts = fieldPath.split(/[.[]/).map((p) => p.replace(/\]$/, ""));
  return MONEY_FIELD_KEYS.has(parts[parts.length - 1]);
}

const CURRENCY_SYMBOLS = { USD: "$", EUR: "€", GBP: "£", INR: "₹" };

// Human labels for document_type -- the raw type strings (telecom_bill,
// hotel_invoice, ...) must never reach the employee directly, on the
// claim page's document rows same as everywhere else in the review UI.
const DOCUMENT_TYPE_LABELS = {
  telecom_bill: "Phone bill",
  restaurant_bill: "Restaurant bill",
  local_conveyance_form: "Conveyance form",
  approval_correspondence: "Approval email",
  hotel_invoice: "Hotel receipt",
  taxi_receipt: "Taxi receipt",
  fuel_receipt: "Fuel receipt",
  unstructured_proof: "Receipt",
  generic_receipt: "Receipt",
};

function documentTypeLabel(docType) {
  return DOCUMENT_TYPE_LABELS[docType] || "Document";
}

function fmtMoney(value, currency) {
  if (value === null || value === undefined || value === "") return "–";
  const num = Number(value);
  if (Number.isNaN(num)) return String(value);
  if (currency === "INR") {
    return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", minimumFractionDigits: 2 }).format(num);
  }
  if (!currency) {
    // currency is only ever null/absent when it's genuinely ambiguous
    // (see validate.detect_currency_from_markdown) -- never assume INR.
    return `${num.toFixed(2)} (currency unknown)`;
  }
  const symbol = CURRENCY_SYMBOLS[currency] || "";
  return `${symbol}${num.toFixed(2)} ${currency}`;
}

// A claim's total across ALL its currencies, never added together --
// one figure when everything confirmed shares a currency, a per-currency
// breakdown otherwise.
function fmtTotals(claim) {
  const entries = Object.entries(claim.totals_by_currency || {});
  if (entries.length <= 1) {
    return fmtMoney(claim.total_amount, claim.currency);
  }
  return entries
    .map(([currency, amount]) => fmtMoney(amount, currency === "unknown" ? null : currency))
    .join(" + ");
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function debounce(fn, ms) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

function chipFor(doc) {
  if (doc.status === "processing") return { label: "Reading…", cls: "chip-processing" };
  if (doc.status === "failed") return { label: "Couldn't read – Retry", cls: "chip-failed" };
  if (doc.status === "needs_review") return { label: "Check this", cls: "chip-review" };
  if (doc.status === "confirmed") return { label: "Confirmed", cls: "chip-confirmed" };
  if (doc.review && doc.review.needs_confirm === false) return { label: "Confirmed", cls: "chip-confirmed" };
  return { label: "Ready to confirm", cls: "chip-ready" };
}

function docNeedsConfirmStill(doc) {
  if (doc.status === "confirmed") return false;
  if (doc.review && doc.review.needs_confirm === false) return false;
  return true;
}

/* Confirm dialog -- no browser alert()/confirm(), an inline overlay instead. */
function confirmDialog(message) {
  return new Promise((resolve) => {
    const root = document.getElementById("dialog-root");
    root.innerHTML = `
      <div class="overlay" role="presentation">
        <div class="confirm-dialog" role="alertdialog" aria-modal="true">
          <p>${escapeHtml(message)}</p>
          <div class="dialog-actions">
            <button type="button" id="dlg-cancel">Cancel</button>
            <button type="button" class="danger" id="dlg-ok">Discard</button>
          </div>
        </div>
      </div>`;
    const cleanup = (result) => { root.innerHTML = ""; resolve(result); };
    root.querySelector("#dlg-cancel").addEventListener("click", () => cleanup(false));
    root.querySelector("#dlg-ok").addEventListener("click", () => cleanup(true));
  });
}

/* ------------------------------------------------------------- router */

const routes = [];
function route(pattern, handler) { routes.push({ pattern, handler }); }

let activeGuard = null; // async () => boolean (true = allow navigation)

async function router() {
  const hash = location.hash || "#/";
  // Only the document review page opts into the wider layout (item 4);
  // every other page keeps #app's normal 900px width. Reset here, not
  // in each non-document handler, so it can't be forgotten on a route
  // added later.
  document.getElementById("app").classList.remove("wide");
  if (activeGuard) {
    const guard = activeGuard;
    activeGuard = null;
    const allowed = await guard();
    if (!allowed) {
      return; // guard rejected navigation -- URL already changed, but we just don't render the new route
    }
  }
  for (const r of routes) {
    const m = hash.match(r.pattern);
    if (m) { r.handler(...m.slice(1)); return; }
  }
  renderMyClaims();
}

window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

function navigate(path) {
  if (location.hash === path) { router(); return; }
  location.hash = path;
}

/* ---------------------------------------------------------- My claims */

route(/^#\/$/, renderMyClaims);

async function renderMyClaims() {
  const app = document.getElementById("app");
  app.innerHTML = `<div class="page-header"><h1>My claims</h1><button class="primary" id="new-claim">New claim</button></div><div id="claims-body">Loading…</div>`;
  document.getElementById("new-claim").addEventListener("click", async (e) => {
    e.target.disabled = true;
    try {
      const claim = await api("POST", "/api/claims", {});
      navigate(`#/claims/${claim.id}`);
    } catch (err) {
      e.target.disabled = false;
      alertInline("claims-body", err.message);
    }
  });

  let claims;
  try {
    claims = await api("GET", "/api/claims");
  } catch (err) {
    document.getElementById("claims-body").innerHTML = `<div class="warning-line">${escapeHtml(err.message)}</div>`;
    return;
  }

  const body = document.getElementById("claims-body");
  if (claims.length === 0) {
    body.innerHTML = `<div class="empty-state">No claims yet. Click "New claim" to add your first receipt or bill.</div>`;
    return;
  }
  body.innerHTML = `<div class="claims-list">${claims.map(claimRowHtml).join("")}</div>`;
}

function claimRowHtml(c) {
  const pillClass = c.status === "submitted" ? "submitted" : "draft";
  const pillLabel = c.status === "submitted" ? "Submitted" : "Draft";
  return `
    <a class="claim-row" href="#/claims/${c.id}">
      <div>
        <div class="title">${escapeHtml(c.title)}</div>
        <div class="meta">${c.document_count} document${c.document_count === 1 ? "" : "s"} &middot; updated ${fmtDate(c.updated_at)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="amount">${fmtTotals(c)}</span>
        <span class="status-pill ${pillClass}">${pillLabel}</span>
      </div>
    </a>`;
}

function alertInline(containerId, message) {
  const el = document.getElementById(containerId);
  const div = document.createElement("div");
  div.className = "warning-line";
  div.style.marginBottom = "12px";
  div.textContent = message;
  el.prepend(div);
}

/* ------------------------------------------------------------ Claim page */

route(/^#\/claims\/([^/]+)$/, renderClaimPage);

let claimPollTimer = null;

function stopClaimPolling() {
  if (claimPollTimer) { clearInterval(claimPollTimer); claimPollTimer = null; }
}

async function renderClaimPage(claimId) {
  stopClaimPolling();
  const app = document.getElementById("app");
  app.innerHTML = `<a class="back-link" href="#/">&larr; My claims</a><div id="claim-body">Loading…</div>`;

  let claim;
  try {
    claim = await api("GET", `/api/claims/${claimId}`);
  } catch (err) {
    document.getElementById("claim-body").innerHTML = `<div class="warning-line">${escapeHtml(err.message)}</div>`;
    return;
  }

  drawClaimPage(claim);

  const anyProcessing = claim.documents.some((d) => d.status === "processing");
  if (anyProcessing) {
    claimPollTimer = setInterval(async () => {
      let fresh;
      try {
        fresh = await api("GET", `/api/claims/${claimId}`);
      } catch (err) {
        return;
      }
      drawClaimPage(fresh);
      if (!fresh.documents.some((d) => d.status === "processing")) stopClaimPolling();
    }, 2000);
  }
}

function drawClaimPage(claim) {
  const body = document.getElementById("claim-body");
  const isDraft = claim.status === "draft";

  const pending = claim.documents.filter(docNeedsConfirmStill).map((d) => d.original_name);
  let submitDisabled = false;
  let submitReason = "";
  if (claim.documents.length === 0) {
    submitDisabled = true;
    submitReason = "Add at least one document to submit.";
  } else if (pending.length > 0) {
    submitDisabled = true;
    submitReason = `Confirm every document before submitting: ${pending.join(", ")}`;
  }

  const submittedBanner = !isDraft ? `
    <div class="card" style="border-color:var(--ok);">
      <strong>Submitted on ${fmtDate(claim.submitted_at)}</strong>
      <div>Waiting for your manager's approval</div>
      <div style="margin-top:4px;">Total: <strong>${fmtTotals(claim)}</strong></div>
      ${correctionsSummaryHtml(claim)}
    </div>` : "";

  // Draft: an editable textarea, always shown (even empty, as a prompt
  // to fill it in). Submitted: plain read-only text, and the whole
  // section is left out entirely when there's nothing to show -- never
  // an empty box, and never an <input>/<textarea> a submitted claim's
  // page must not contain at all.
  const noteSection = isDraft
    ? `<div class="card" style="margin-top:16px;">
        <label for="note-field" style="font-weight:600;font-size:13px;color:var(--ink-muted);">Note to approver</label>
        <textarea id="note-field" placeholder="Explain anything unusual about this claim (optional)">${escapeHtml(claim.note_to_approver || "")}</textarea>
      </div>`
    : claim.note_to_approver
      ? `<div class="card" style="margin-top:16px;">
          <div style="font-weight:600;font-size:13px;color:var(--ink-muted);">Note to approver</div>
          <div style="margin-top:6px;white-space:pre-wrap;">${escapeHtml(claim.note_to_approver)}</div>
        </div>`
      : "";

  body.innerHTML = `
    ${isDraft
      ? `<input class="claim-title-input" id="claim-title" value="${escapeHtml(claim.title)}" aria-label="Claim title">`
      : `<h1>${escapeHtml(claim.title)}</h1>`}
    ${submittedBanner}
    ${isDraft ? `<div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Add documents">
        Drag receipts or bills here, or click to choose files
        <input type="file" id="file-input" multiple accept="application/pdf,image/png,image/jpeg,image/webp" style="display:none;">
      </div>` : ""}
    <div id="upload-errors"></div>
    <div class="doc-list">
      ${claim.documents.length === 0 ? `<div class="empty-state">No documents yet.</div>` : claim.documents.map(docRowHtml).join("")}
    </div>
    ${noteSection}
    ${isDraft ? `<div class="claim-total-row">
      <span>Total</span>
      <span class="amount">${fmtTotals(claim)}</span>
    </div>` : ""}
  `;

  renderClaimActionBar(claim, submitDisabled, submitReason);

  if (isDraft) {
    document.getElementById("claim-title").addEventListener("change", async (e) => {
      try {
        await api("PATCH", `/api/claims/${claim.id}`, { title: e.target.value });
        setActionBarStatus("Saved", false);
      } catch (err) {
        setActionBarStatus(err.message, true);
      }
    });

    const saveNote = debounce(async (value) => {
      try {
        await api("PATCH", `/api/claims/${claim.id}`, { note_to_approver: value });
        setActionBarStatus("Saved", false);
      } catch (err) {
        setActionBarStatus(err.message, true);
      }
    }, 400);
    document.getElementById("note-field").addEventListener("input", (e) => saveNote(e.target.value));

    wireDropzone(claim.id);
  }
}

// Column headers for the two array-shaped fields -- kept separate from
// the review screen's own <table> headers (tripsTableHtml/
// collapsibleHtml) since this needs them by key, not as rendered HTML.
const ITEM_COLUMN_LABELS = { name: "Item", quantity: "Qty", unit_price: "Unit price", total: "Amount" };
const TRIP_COLUMN_LABELS = { date: "Date", place: "Place", purpose: "Purpose", client: "Client", kms: "Km" };

/* Same label a field shows on the review screen, extended to array
   cell paths (e.g. "line_items[2].total" -> "Items, row 3, Amount")
   the review screen doesn't have a single label for since it renders
   those as table cells, not field rows. */
function humanFieldLabel(doc, fieldPath) {
  const arrayMatch = fieldPath.match(/^(line_items|travel_entries)\[(\d+)\](?:\.(.+))?$/);
  if (arrayMatch) {
    const [, root, indexStr, subKey] = arrayMatch;
    const rowLabel = root === "line_items" ? "Items" : "Trips";
    const rowNumber = Number(indexStr) + 1;
    if (!subKey) return `${rowLabel}, row ${rowNumber}`;
    const columnLabels = root === "line_items" ? ITEM_COLUMN_LABELS : TRIP_COLUMN_LABELS;
    return `${rowLabel}, row ${rowNumber}, ${columnLabels[subKey] || subKey}`;
  }
  const field = (doc.review && doc.review.fields || []).find((f) => f.key === fieldPath);
  if (field) return field.label;
  if (fieldPath === "currency") return "Currency";
  return fieldPath;
}

function formatCorrectionValue(value, fieldPath, currency) {
  if (value === null || value === undefined) return "–";
  if (typeof value === "object") {
    return Object.entries(value).map(([k, v]) => `${k}: ${v}`).join(", ");
  }
  if (isMoneyFieldPath(fieldPath)) return fmtMoney(value, currency);
  return String(value);
}

function correctionsSummaryHtml(claim) {
  const rows = [];
  for (const doc of claim.documents) {
    const currency = doc.review ? doc.review.currency : null;
    for (const c of doc.corrections || []) {
      rows.push({
        doc: doc.original_name,
        field: humanFieldLabel(doc, c.field_path),
        ai: formatCorrectionValue(c.ai_value, c.field_path, currency),
        you: formatCorrectionValue(c.employee_value, c.field_path, currency),
        reason: c.reason,
      });
    }
  }
  if (rows.length === 0) return "";
  return `
    <div class="corrections-summary">
      <div style="font-weight:600;margin-top:10px;margin-bottom:4px;">Values you corrected</div>
      <table>
        <thead><tr><th>Document</th><th>Field</th><th>AI read</th><th>You entered</th><th>Reason</th></tr></thead>
        <tbody>
          ${rows.map((r) => `<tr><td>${escapeHtml(r.doc)}</td><td>${escapeHtml(r.field)}</td><td>${escapeHtml(r.ai)}</td><td>${escapeHtml(r.you)}</td><td>${r.reason ? escapeHtml(r.reason) : "–"}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function docRowHtml(d) {
  const chip = chipFor(d);
  return `
    <a class="doc-row" href="#/documents/${d.id}">
      <span class="name">${escapeHtml(docRowLabel(d))}</span>
      <span class="chip ${chip.cls}">${chip.label}</span>
    </a>`;
}

/* "<type label> · <amount>" once the document has been read (e.g.
   "Hotel receipt · $780.70") -- falls back to the uploaded filename
   while still processing/failed, before there's a type or amount to
   show. Amount is omitted for a type with none to report (e.g. an
   approval email). Same on the claim page whether it's still a draft
   or already submitted -- this doesn't depend on claim/document status. */
function docRowLabel(d) {
  if (!d.review) return d.original_name;
  const typeLabel = documentTypeLabel(d.review.document_type);
  const categoryLabel = d.review.category && d.review.category.label;
  const parts = [typeLabel];
  if (categoryLabel) parts.push(categoryLabel);
  if (d.review.amount !== null && d.review.amount !== undefined) {
    parts.push(fmtMoney(d.review.amount, d.review.currency));
  }
  return parts.join(" · ");
}

function renderClaimActionBar(claim, submitDisabled, submitReason) {
  let bar = document.querySelector(".action-bar");
  if (bar) bar.remove();
  if (claim.status !== "draft") return;
  bar = document.createElement("div");
  bar.className = "action-bar";
  bar.innerHTML = `
    <span class="status-msg" id="claim-status-msg" title="${escapeHtml(submitReason)}">${submitDisabled ? escapeHtml(submitReason) : ""}</span>
    <button class="primary" id="submit-claim" ${submitDisabled ? "disabled" : ""}>Submit claim</button>
  `;
  document.body.appendChild(bar);
  document.getElementById("submit-claim").addEventListener("click", async (e) => {
    e.target.disabled = true;
    try {
      const submitted = await api("POST", `/api/claims/${claim.id}/submit`);
      drawClaimPage(submitted);
    } catch (err) {
      setActionBarStatus(err.message, true);
      e.target.disabled = false;
    }
  });
}

function setActionBarStatus(message, isError) {
  const el = document.getElementById("claim-status-msg");
  if (!el) return;
  el.textContent = message;
  el.className = "status-msg" + (isError ? " error" : " saved");
  if (!isError) setTimeout(() => { if (el.textContent === message) el.textContent = ""; }, 2500);
}

function wireDropzone(claimId) {
  const zone = document.getElementById("dropzone");
  const input = document.getElementById("file-input");
  zone.addEventListener("click", () => input.click());
  zone.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  input.addEventListener("change", () => { handleFiles(claimId, Array.from(input.files)); input.value = ""; });

  ["dragenter", "dragover"].forEach((evt) => zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach((evt) => zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove("dragover"); }));
  zone.addEventListener("drop", (e) => {
    const files = Array.from(e.dataTransfer.files || []);
    if (files.length) handleFiles(claimId, files);
  });
}

async function handleFiles(claimId, files) {
  const errBox = document.getElementById("upload-errors");
  errBox.innerHTML = "";
  for (const file of files) {
    try {
      await uploadFile(claimId, file);
    } catch (err) {
      const div = document.createElement("div");
      div.className = "warning-line";
      div.style.marginBottom = "8px";
      div.textContent = `${file.name}: ${err.message}`;
      errBox.appendChild(div);
    }
  }
  renderClaimPage(claimId);
}

/* ------------------------------------------------------- Document review */

route(/^#\/documents\/([^/]+)$/, renderDocumentPage);

let docPageState = null; // { doc, edits: {path: value}, dirty: bool, saving: bool }

async function renderDocumentPage(documentId) {
  const app = document.getElementById("app");
  app.classList.add("wide");
  app.innerHTML = `<div id="doc-body">Loading…</div>`;

  let doc;
  try {
    doc = await api("GET", `/api/documents/${documentId}`);
  } catch (err) {
    document.getElementById("doc-body").innerHTML = `<div class="warning-line">${escapeHtml(err.message)}</div>`;
    return;
  }

  docPageState = { doc, edits: {}, dirty: false, saving: false, reason: "", categoryEdit: undefined };

  activeGuard = async () => {
    if (!docPageState || !docPageState.dirty) return true;
    return await confirmDialog("Discard unsaved changes?");
  };

  drawDocumentPage();
}

function backToClaim() {
  navigate(`#/claims/${docPageState.doc.claim_id || claimIdFromReferrer()}`);
}

function claimIdFromReferrer() {
  // claim_id isn't in the document payload; recovered from the claim
  // page's own link structure isn't available here, so the API returns
  // it explicitly -- see _document_detail's claim_id field.
  return docPageState.doc.claim_id;
}

function drawDocumentPage() {
  const { doc } = docPageState;
  const body = document.getElementById("doc-body");
  const claimHash = `#/claims/${doc.claim_id}`;

  if (doc.status === "processing") {
    body.innerHTML = `<a class="back-link" href="${claimHash}">&larr; Back to claim</a><div class="empty-state">Still reading this document…</div>`;
    setTimeout(async () => {
      if (!docPageState || docPageState.doc.id !== doc.id) return;
      const fresh = await api("GET", `/api/documents/${doc.id}`).catch(() => null);
      if (fresh && docPageState && docPageState.doc.id === doc.id) {
        docPageState.doc = fresh;
        drawDocumentPage();
      }
    }, 2000);
    return;
  }

  if (doc.status === "failed") {
    body.innerHTML = `
      <a class="back-link" href="${claimHash}">&larr; Back to claim</a>
      <div class="warning-line">Couldn't read this document${doc.error_message ? ": " + escapeHtml(doc.error_message) : "."}</div>
      <button class="primary" id="retry-btn">Retry</button>
      <button id="remove-btn" style="margin-left:8px;">Remove document</button>
      <div id="inline-remove"></div>`;
    document.getElementById("retry-btn").addEventListener("click", async (e) => {
      e.target.disabled = true;
      try {
        await api("POST", `/api/documents/${doc.id}/retry`);
        navigate(claimHash);
      } catch (err) {
        e.target.disabled = false;
        alertInline("doc-body", err.message);
      }
    });
    wireRemoveButton(doc);
    return;
  }

  const review = doc.review;
  const isSupportingDoc = !review.needs_confirm; // e.g. approval correspondence -- never needs Confirm
  const isConfirmed = doc.status === "confirmed";

  body.innerHTML = `
    <a class="back-link" href="${claimHash}">&larr; Back to claim</a>
    <div style="display:flex;align-items:center;gap:10px;">
      <h1 style="font-size:18px;margin:0;">${escapeHtml(doc.original_name)}</h1>
      ${isConfirmed ? `<span class="chip chip-confirmed">Confirmed</span>` : ""}
    </div>
    ${isSupportingDoc && !isConfirmed ? `<div class="read-only-note">This is a supporting document. Nothing to confirm here.</div>` : ""}
    <div class="review-layout">
      <div class="doc-preview">${previewHtml(doc)}</div>
      <div>
        <div id="warnings-container"></div>
        <div id="fields-container"></div>
      </div>
    </div>
  `;

  renderFields(review);
  renderWarningsAndReasonBox();
  renderDocActionBar();
  wirePreviewToolbar();
}

/* Money-edit reason box: shown under the warnings whenever the server
   says this document's current fields differ from the AI's on a money
   field AND an arithmetic check still fails (server._reason_required_for
   is the single source of truth -- the UI only reflects it). Re-run on
   every validate() response too, so it appears/disappears live as the
   employee types, without a full page redraw that would drop focus. */
function renderWarningsAndReasonBox() {
  const container = document.getElementById("warnings-container");
  if (!container) return;
  const review = docPageState.doc.review;
  const warningsHtml = (review.warnings || []).map((w) => `<div class="warning-line">${escapeHtml(w)}</div>`).join("");

  let suggestionHtml = "";
  const suggestions = review.suggestions || [];
  if (suggestions.length > 0 && review.suggestion_sentence) {
    suggestionHtml = `
      <div id="suggestion-box" class="warning-line">
        <div>${escapeHtml(review.suggestion_sentence)}</div>
        <button type="button" id="btn-apply-suggestions" style="margin-top:6px;">Apply</button>
      </div>`;
  }

  let reasonHtml = "";
  if (review.reason_required) {
    reasonHtml = `
      <div id="reason-box" class="warning-line">
        <div>This doesn't match the bill's own numbers. Why is it different?</div>
        <textarea id="reason-input" rows="2" style="width:100%;margin-top:6px;box-sizing:border-box;">${escapeHtml(docPageState.reason || "")}</textarea>
      </div>`;
  } else {
    docPageState.reason = "";
  }
  container.innerHTML = warningsHtml + suggestionHtml + reasonHtml;
  const reasonInput = document.getElementById("reason-input");
  if (reasonInput) {
    reasonInput.addEventListener("input", (e) => {
      docPageState.reason = e.target.value;
      updateActionBarState();
    });
  }
  const applyBtn = document.getElementById("btn-apply-suggestions");
  if (applyBtn) applyBtn.addEventListener("click", applySuggestions);
  updateActionBarState();
}

/* Fills every current suggestion's field as a normal employee edit
   (docPageState.edits), the same as typing it in by hand -- still
   shown "changed" vs the AI value, still saved/confirmed the normal
   way. Suggestions never apply themselves; this only runs on the
   click. Re-validates immediately (not the debounced version) so the
   box disappears as soon as the checks pass. */
async function applySuggestions() {
  const suggestions = (docPageState.doc.review.suggestions || []).slice();
  if (suggestions.length === 0) return;
  for (const s of suggestions) {
    docPageState.edits[s.field] = s.suggested_value;
  }
  markDirty();
  renderFields(docPageState.doc.review);
  await runValidate();
}

function previewHtml(doc) {
  const url = `/api/documents/${doc.id}/file`;
  if (doc.mime_type === "application/pdf") {
    return `<iframe src="${url}" title="Document preview"></iframe>`;
  }
  return `
    <div class="preview-toolbar">
      <button type="button" id="btn-preview-actual" class="active">Actual size</button>
      <button type="button" id="btn-preview-fit">Fit to screen</button>
    </div>
    <div class="preview-scroll" id="preview-scroll">
      <img src="${url}" alt="Document preview">
    </div>`;
}

/* Item 1: default is "actual size" (full panel width, scrolls
   vertically to see the whole image, per the bug repro); "Fit to
   screen" shrinks the whole image into view instead. No-op for a PDF
   (no toolbar exists then). */
function wirePreviewToolbar() {
  const scroll = document.getElementById("preview-scroll");
  const actualBtn = document.getElementById("btn-preview-actual");
  const fitBtn = document.getElementById("btn-preview-fit");
  if (!scroll || !actualBtn || !fitBtn) return;
  actualBtn.addEventListener("click", () => {
    scroll.classList.remove("fit-mode");
    actualBtn.classList.add("active");
    fitBtn.classList.remove("active");
  });
  fitBtn.addEventListener("click", () => {
    scroll.classList.add("fit-mode");
    fitBtn.classList.add("active");
    actualBtn.classList.remove("active");
  });
}

function currentFieldValue(field) {
  return Object.prototype.hasOwnProperty.call(docPageState.edits, field.key) ? docPageState.edits[field.key] : field.value;
}

/* A field counts as "changed" either because of an unsaved local edit
   this session, or because a correction was already saved to the server
   on a previous save -- the AI-value-struck-through marker must survive
   a reload, so it can't rely on docPageState.edits alone (session-only). */
function fieldChangeInfo(key, currentSavedValue) {
  const localEdit = Object.prototype.hasOwnProperty.call(docPageState.edits, key);
  const correction = (docPageState.doc.corrections || []).find((c) => c.field_path === key);
  if (localEdit) return { changed: true, aiValue: currentSavedValue };
  if (correction) return { changed: true, aiValue: correction.ai_value };
  return { changed: false, aiValue: null };
}

function markDirty() {
  docPageState.dirty = Object.keys(docPageState.edits).length > 0 || docPageState.categoryEdit !== undefined;
  updateActionBarState();
}

/* Confirmed, or the whole claim already submitted: plain values
   everywhere, no inputs, regardless of a field's own `editable` flag. */
function isFieldsLocked() {
  const doc = docPageState.doc;
  return doc.status === "confirmed" || doc.claim_status === "submitted";
}

function renderFields(review) {
  const container = document.getElementById("fields-container");
  let html = "";
  html += categoryFieldHtml(review.category);
  for (const field of review.fields) {
    if (field.key === "travel_entries") {
      html += tripsTableHtml(field);
    } else {
      html += simpleFieldHtml(field);
    }
  }
  if (review.collapsible) {
    html += collapsibleHtml(review.collapsible);
  }
  container.innerHTML = html;
  wireFieldInputs();
}

/* Category isn't a claim field (schemas.py) -- it lives on its own
   Extraction columns (categories.py) and is saved via a top-level
   `category` key, never inside `edits`. No reason required (not money).
   Supporting documents (approval emails) get `category: null` from the
   server and show no row at all here. */
function categoryFieldHtml(category) {
  if (!category) return "";
  const currentValue = docPageState.categoryEdit !== undefined ? docPageState.categoryEdit : category.value;
  const note = category.needs_check && docPageState.categoryEdit === undefined
    ? `<div class="ai-was">Please check the category.</div>` : "";
  if (isFieldsLocked()) {
    const label = (category.options.find((o) => o.id === currentValue) || {}).label || "–";
    return `<div class="field-row"><label>Category</label><div class="field-value">${escapeHtml(label)}</div></div>`;
  }
  const options = category.options
    .map((opt) => `<option value="${escapeHtml(opt.id)}" ${opt.id === currentValue ? "selected" : ""}>${escapeHtml(opt.label)}</option>`)
    .join("");
  return `
    <div class="field-row">
      <label for="f-category">Category</label>
      <select id="f-category">
        <option value="" ${!currentValue ? "selected" : ""}>Choose…</option>
        ${options}
      </select>
      ${note}
    </div>`;
}

function simpleFieldHtml(field) {
  const value = currentFieldValue(field);
  const { changed, aiValue } = fieldChangeInfo(field.key, field.value);
  const displayAsMoney = MONEY_FIELD_KEYS.has(field.key) && typeof field.value !== "object";
  const docCurrency = docPageState.doc.review.currency;
  const changedMarker = changed
    ? `<div class="ai-was"><span class="pen">✎</span> AI read <span class="old-val">${escapeHtml(aiValue ?? "–")}</span></div>`
    : "";
  // item 4: a failing trips check highlights this field too, alongside
  // the trips table's own Km column header.
  const highlight = field.key === "total_kms" && docPageState.doc.review.trips_check_failed;
  const rowClass = `field-row${highlight ? " field-highlight" : ""}`;
  if (!field.editable || isFieldsLocked()) {
    const shown = displayAsMoney ? fmtMoney(value, docCurrency) : escapeHtml(value ?? "–");
    return `<div class="${rowClass}" data-field-key="${field.key}"><label>${escapeHtml(field.label)}</label><div class="field-value">${shown}</div>${changedMarker}</div>`;
  }
  if (field.type === "select") {
    const options = (field.options || [])
      .map((opt) => `<option value="${escapeHtml(opt)}" ${opt === value ? "selected" : ""}>${escapeHtml(opt)}</option>`)
      .join("");
    return `
      <div class="${rowClass}" data-field-key="${field.key}">
        <label for="f-${field.key}">${escapeHtml(field.label)}</label>
        <select id="f-${field.key}" data-path="${field.key}" class="${changed ? "field-changed" : ""}">
          <option value="" ${!value ? "selected" : ""}>Choose…</option>
          ${options}
        </select>
        ${changedMarker}
      </div>`;
  }
  return `
    <div class="${rowClass}" data-field-key="${field.key}">
      <label for="f-${field.key}">${escapeHtml(field.label)}</label>
      <input type="text" id="f-${field.key}" data-path="${field.key}" class="${changed ? "field-changed" : ""}"
             value="${escapeHtml(value ?? "")}" inputmode="${displayAsMoney ? "decimal" : "text"}">
      ${changedMarker}
    </div>`;
}

/* Item 4: the Km column header + Total km field's yellow highlight
   must clear the moment the trips check passes (e.g. right after
   Apply) -- toggles the existing DOM nodes' class directly instead of
   a full renderFields() re-render, which would drop focus/cursor
   mid-typing (this runs from the live-validate path too). */
function updateTripsHighlight() {
  const failed = !!(docPageState.doc.review && docPageState.doc.review.trips_check_failed);
  const kmHeader = document.querySelector("#trips-table th.col-kms");
  if (kmHeader) kmHeader.classList.toggle("field-highlight", failed);
  const totalKmRow = document.querySelector('.field-row[data-field-key="total_kms"]');
  if (totalKmRow) totalKmRow.classList.toggle("field-highlight", failed);
}

const TRIP_COLS = [
  ["date", "Date", "col-date"],
  ["place", "Place", "col-place"],
  ["purpose", "Purpose", "col-purpose"],
  ["client", "Client", "col-client"],
  ["kms", "Km", "col-kms col-num"],
];

function tripsTableHtml(field) {
  const trips = currentFieldValue(field) || [];
  const { changed } = fieldChangeInfo(field.key, field.value);
  const locked = isFieldsLocked();
  const kmHeaderHighlight = docPageState.doc.review.trips_check_failed ? " field-highlight" : "";
  const rows = trips.map((trip, i) => `
    <tr>
      ${TRIP_COLS.map(([key, _label, cls]) => locked
        ? `<td class="${cls}">${escapeHtml(trip[key] ?? "")}</td>`
        : `<td class="cell-editable ${cls}" data-trip-index="${i}" data-trip-key="${key}">`
          + `<span class="cell-text" tabindex="0">${escapeHtml(trip[key] ?? "")}</span></td>`
      ).join("")}
    </tr>`).join("");
  return `
    <div class="field-row">
      <label>Trips</label>
      <div class="table-scroll">
        <table class="trips-table" id="trips-table">
          <colgroup>${TRIP_COLS.map(([, , cls]) => `<col class="${cls.split(" ")[0]}">`).join("")}</colgroup>
          <thead><tr>${TRIP_COLS.map(([key, label, cls]) =>
            `<th class="${cls}${key === "kms" ? kmHeaderHighlight : ""}">${label}</th>`
          ).join("")}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${changed ? `<div class="ai-was"><span class="pen">✎</span> Trips edited</div>` : ""}
    </div>`;
}

function collapsibleHtml(collapsible) {
  const items = currentFieldValue({ key: "line_items", value: collapsible.line_items }) || collapsible.line_items || [];
  const { changed: itemsChanged } = fieldChangeInfo("line_items", collapsible.line_items);
  const locked = isFieldsLocked();
  const cols = [["name", "Item"], ["quantity", "Qty"], ["unit_price", "Unit price"], ["total", "Amount"]];
  const extra = (collapsible.extra_fields || []).map((f) => simpleFieldHtml(f)).join("");

  const body = items.length === 0
    ? `<div class="empty-items">
        No items found on this document.
        ${locked ? "" : `<div><button type="button" id="btn-add-item">Add item</button></div>`}
      </div>`
    : `<div class="table-scroll">
        <table class="items-table" id="items-table">
          <thead><tr>${cols.map(([, label]) => `<th>${label}</th>`).join("")}</tr></thead>
          <tbody>${items.map((item, i) => `
            <tr>
              ${cols.map(([key]) => locked
                ? `<td>${escapeHtml(item[key] ?? "")}</td>`
                : `<td><input type="text" data-item-index="${i}" data-item-key="${key}" value="${escapeHtml(item[key] ?? "")}"></td>`
              ).join("")}
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      ${locked ? "" : `<button type="button" id="btn-add-item" style="margin-top:8px;">Add item</button>`}`;

  return `
    <details class="collapsible" ${collapsible.auto_expand ? "open" : ""}>
      <summary>${escapeHtml(collapsible.label)}</summary>
      ${extra}
      ${body}
      ${itemsChanged ? `<div class="ai-was"><span class="pen">✎</span> Items edited</div>` : ""}
    </details>`;
}

function addBlankLineItem() {
  // renderFields() below fully replaces the <details> element, which
  // would otherwise reset to auto_expand's value and collapse right
  // back on the employee after they just opened it to click this.
  const wasOpen = document.querySelector("#fields-container details.collapsible")?.open;
  const collapsible = docPageState.doc.review.collapsible;
  const current = Object.prototype.hasOwnProperty.call(docPageState.edits, "line_items")
    ? docPageState.edits["line_items"]
    : JSON.parse(JSON.stringify(collapsible.line_items || []));
  current.push({ name: "", quantity: "", unit_price: "", total: "" });
  docPageState.edits["line_items"] = current;
  markDirty();
  renderFields(docPageState.doc.review);
  if (wasOpen) {
    const details = document.querySelector("#fields-container details.collapsible");
    if (details) details.open = true;
  }
  debouncedValidate();
}

const debouncedValidate = debounce(runValidate, 400);

function wireFieldInputs() {
  document.querySelectorAll("#fields-container input[data-path], #fields-container select[data-path]").forEach((input) => {
    input.addEventListener("input", (e) => {
      docPageState.edits[e.target.dataset.path] = e.target.value;
      markDirty();
      debouncedValidate();
    });
  });
  const categorySelect = document.getElementById("f-category");
  if (categorySelect) {
    categorySelect.addEventListener("change", (e) => {
      docPageState.categoryEdit = e.target.value;
      markDirty();
    });
  }
  document.querySelectorAll("#trips-table .cell-text").forEach(wireTripCell);
  document.querySelectorAll("#items-table input[data-item-index]").forEach((input) => {
    input.addEventListener("input", (e) => {
      applyTableEdit("line_items", Number(e.target.dataset.itemIndex), e.target.dataset.itemKey, e.target.value);
      markDirty();
      debouncedValidate();
    });
  });
  const addItemBtn = document.getElementById("btn-add-item");
  if (addItemBtn) addItemBtn.addEventListener("click", addBlankLineItem);
}

/* Item 4: trips-table cells are plain text until clicked, focused
   (Tab reaches them, since .cell-text is a normal tabbable element),
   or activated with Enter -- never a bordered input sitting there
   unedited. Enter or blur commits; Escape reverts without marking the
   document dirty. */
function wireTripCell(span) {
  if (!span) return;
  span.addEventListener("click", () => activateTripCell(span));
  span.addEventListener("focus", () => activateTripCell(span));
  span.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); activateTripCell(span); }
  });
}

function activateTripCell(span) {
  const td = span.closest("td");
  if (!td || td.querySelector("input")) return;
  const index = Number(td.dataset.tripIndex);
  const key = td.dataset.tripKey;
  const currentValue = span.textContent;
  const isNumeric = td.classList.contains("col-num");

  td.innerHTML = "";
  const input = document.createElement("input");
  input.type = "text";
  input.value = currentValue;
  if (isNumeric) input.inputMode = "decimal";
  td.appendChild(input);
  input.focus();
  input.select();

  const revert = () => {
    input.removeEventListener("blur", commit);
    td.innerHTML = `<span class="cell-text" tabindex="0">${escapeHtml(currentValue)}</span>`;
    wireTripCell(td.querySelector(".cell-text"));
  };
  const commit = () => {
    const newValue = input.value;
    applyTableEdit("travel_entries", index, key, newValue);
    markDirty();
    debouncedValidate();
    td.innerHTML = `<span class="cell-text" tabindex="0">${escapeHtml(newValue)}</span>`;
    wireTripCell(td.querySelector(".cell-text"));
  };
  input.addEventListener("blur", commit, { once: true });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    else if (e.key === "Escape") { e.preventDefault(); revert(); }
  });
}

function applyTableEdit(rootKey, index, key, value) {
  const field = docPageState.doc.review.fields.find((f) => f.key === rootKey)
    || { key: rootKey, value: (docPageState.doc.review.collapsible && docPageState.doc.review.collapsible.line_items) || [] };
  const base = docPageState.edits[rootKey] ? docPageState.edits[rootKey] : JSON.parse(JSON.stringify(field.value || []));
  if (!base[index]) base[index] = {};
  base[index][key] = value;
  docPageState.edits[rootKey] = base;
}

async function runValidate() {
  if (!docPageState || Object.keys(docPageState.edits).length === 0) return;
  try {
    const result = await api("POST", `/api/documents/${docPageState.doc.id}/validate`, { edits: docPageState.edits });
    docPageState.doc.review = {
      ...docPageState.doc.review,
      warnings: result.review.warnings,
      needs_review: result.review.needs_review,
      reason_required: result.review.reason_required,
      suggestions: result.review.suggestions,
      suggestion_sentence: result.review.suggestion_sentence,
      trips_check_failed: result.review.trips_check_failed,
    };
    renderWarningsAndReasonBox();
    updateTripsHighlight();
  } catch (err) {
    setDocActionBarStatus(err.message, true);
  }
}

function renderDocActionBar() {
  let bar = document.querySelector(".action-bar");
  if (bar) bar.remove();
  const { doc } = docPageState;
  const review = doc.review;
  const isConfirmed = doc.status === "confirmed";
  const isClaimSubmitted = doc.claim_status === "submitted";
  const isLocked = isConfirmed || isClaimSubmitted;

  const showEditControls = review.needs_confirm && !isLocked;
  const showEditAgain = isConfirmed && !isClaimSubmitted;
  const showRemove = !isConfirmed && !isClaimSubmitted;

  if (!showEditControls && !showEditAgain && !showRemove) {
    return; // nothing actionable left on this document (e.g. a supporting
    // document once the whole claim is submitted) -- no action bar at all
  }

  bar = document.createElement("div");
  bar.className = "action-bar";
  const dirtyLabel = docPageState.dirty ? "Unsaved changes" : "";
  bar.innerHTML = `
    <span class="status-msg" id="doc-status-msg">${dirtyLabel}</span>
    ${showEditControls ? `<button id="btn-undo">Undo my changes</button>` : ""}
    ${showEditControls ? `<button id="btn-save">Save changes</button>` : ""}
    ${showEditControls ? `<button class="primary" id="btn-confirm">Confirm</button>` : ""}
    ${showEditAgain ? `<button class="primary" id="btn-edit-again">Edit again</button>` : ""}
    ${showRemove ? `<button class="danger" id="btn-remove">Remove document</button>` : ""}
  `;
  document.body.appendChild(bar);

  const saveBtn = document.getElementById("btn-save");
  if (saveBtn) saveBtn.addEventListener("click", saveDocumentEdits);

  const undoBtn = document.getElementById("btn-undo");
  if (undoBtn) undoBtn.addEventListener("click", undoDocumentChanges);

  const confirmBtn = document.getElementById("btn-confirm");
  if (confirmBtn) confirmBtn.addEventListener("click", confirmDocument);

  const editAgainBtn = document.getElementById("btn-edit-again");
  if (editAgainBtn) editAgainBtn.addEventListener("click", reopenDocument);

  if (showRemove) wireRemoveButton(doc);
  updateActionBarState();
}

async function reopenDocument() {
  setButtonsBusy(true);
  try {
    const updated = await api("POST", `/api/documents/${docPageState.doc.id}/reopen`);
    docPageState.doc = updated;
    docPageState.edits = {};
    docPageState.categoryEdit = undefined;
    docPageState.dirty = false;
    drawDocumentPage();
  } catch (err) {
    setDocActionBarStatus(err.message, true);
    setButtonsBusy(false);
  }
}

function updateActionBarState() {
  const msg = document.getElementById("doc-status-msg");
  if (msg && !msg.classList.contains("error") && !msg.classList.contains("saved")) {
    msg.textContent = docPageState.dirty ? "Unsaved changes" : "";
  }
  const confirmBtn = document.getElementById("btn-confirm");
  if (confirmBtn && docPageState.doc.review) {
    const reasonOk = !docPageState.doc.review.reason_required || (docPageState.reason || "").trim().length >= 5;
    confirmBtn.disabled = !reasonOk;
  }
}

function setDocActionBarStatus(message, isError) {
  const el = document.getElementById("doc-status-msg");
  if (!el) return;
  el.textContent = message;
  el.className = "status-msg" + (isError ? " error" : " saved");
  if (!isError) setTimeout(() => { if (el.textContent === message) updateActionBarState(); }, 2500);
}

function setButtonsBusy(busy) {
  document.querySelectorAll(".action-bar button").forEach((b) => { b.disabled = busy; });
}

async function saveDocumentEdits() {
  const hasCategoryEdit = docPageState.categoryEdit !== undefined;
  if (docPageState.saving || (Object.keys(docPageState.edits).length === 0 && !hasCategoryEdit)) return;
  docPageState.saving = true;
  setButtonsBusy(true);
  try {
    const body = { edits: docPageState.edits };
    if (hasCategoryEdit) body.category = docPageState.categoryEdit;
    const updated = await api("PUT", `/api/documents/${docPageState.doc.id}/fields`, body);
    docPageState.doc = updated;
    docPageState.edits = {};
    docPageState.categoryEdit = undefined;
    docPageState.dirty = false;
    drawDocumentPage();
    setDocActionBarStatus("Saved", false);
  } catch (err) {
    setDocActionBarStatus(err.message, true);
  } finally {
    docPageState.saving = false;
    setButtonsBusy(false);
  }
}

async function undoDocumentChanges() {
  setButtonsBusy(true);
  try {
    const updated = await api("POST", `/api/documents/${docPageState.doc.id}/revert`);
    docPageState.doc = updated;
    docPageState.edits = {};
    docPageState.categoryEdit = undefined;
    docPageState.dirty = false;
    drawDocumentPage();
    setDocActionBarStatus("Reverted to the AI values", false);
  } catch (err) {
    setDocActionBarStatus(err.message, true);
    setButtonsBusy(false);
  }
}

async function confirmDocument() {
  setButtonsBusy(true);
  try {
    const body = { edits: docPageState.edits, reason: docPageState.reason || null };
    if (docPageState.categoryEdit !== undefined) body.category = docPageState.categoryEdit;
    const updated = await api("POST", `/api/documents/${docPageState.doc.id}/confirm`, body);
    docPageState.doc = updated;
    docPageState.edits = {};
    docPageState.categoryEdit = undefined;
    docPageState.dirty = false;
    docPageState.reason = "";
    navigate(`#/claims/${updated.claim_id}`);
  } catch (err) {
    setDocActionBarStatus(err.message, true);
    setButtonsBusy(false);
  }
}

function wireRemoveButton(doc) {
  const btn = document.getElementById("btn-remove") || document.getElementById("remove-btn");
  if (!btn) return;
  btn.addEventListener("click", async () => {
    const box = document.getElementById("inline-remove") || createInlineRemoveBox();
    box.innerHTML = `
      <div class="inline-remove">
        <span>Remove this document?</span>
        <button type="button" class="danger" id="confirm-remove">Remove</button>
        <button type="button" id="cancel-remove">Cancel</button>
      </div>`;
    document.getElementById("cancel-remove").addEventListener("click", () => { box.innerHTML = ""; });
    document.getElementById("confirm-remove").addEventListener("click", async () => {
      try {
        await api("DELETE", `/api/documents/${doc.id}`);
        navigate(`#/claims/${doc.claim_id}`);
      } catch (err) {
        setDocActionBarStatus(err.message, true);
      }
    });
  });
}

function createInlineRemoveBox() {
  const div = document.createElement("div");
  div.id = "inline-remove";
  document.getElementById("doc-body").appendChild(div);
  return div;
}
</script>
</body>
</html>
